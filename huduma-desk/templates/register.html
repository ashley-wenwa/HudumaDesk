{% extends "base.html" %}
{% block title %}Create account - Huduma Desk{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create your account</h1>
  <form method="post">
    {{ csrf_field() }}
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" value="{{ request.form.full_name }}" autocomplete="name" required autofocus>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ request.form.email }}" autocomplete="email" required>
    <label for="password">Password <span class="muted">(8 characters or more)</span></label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" minlength="8" autocomplete="new-password" required>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
</section>
{% endblock %}
